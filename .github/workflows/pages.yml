name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger, from the Actions tab or `gh workflow run pages.yml`. Needed
  # whenever a deploy has to be retried without an empty commit to force it —
  # a failed run, or a push that landed while the Pages service was down.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deploy that is already under way finish instead of killing it for the
# next push. Cancelling mid-flight only makes sense when a newer run supersedes
# an older one cheaply; a Pages deploy waits on an external service, so a slow
# queue turned every push into an assassination — during the 2026-08-06 Actions
# outage one deploy sat 35 minutes and was cancelled by the push behind it
# rather than ever finishing. Queueing is the behaviour we want here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build demo bundle
        run: npm run build:demo

      # Cache-bust the bundle URL with the commit SHA so browsers never serve a
      # stale index.global.js after a deploy.
      - name: Version the demo bundle URL
        run: sed -i "s|index.global.js|index.global.js?v=${GITHUB_SHA}|g" demo/index.html

      # The badge was hand-edited and drifted (it read v0.11.0 at 0.11.9). Take it
      # from package.json at deploy time so it tracks releases on its own.
      - name: Stamp the version badge
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|<span class=\"badge\" id=\"version\">[^<]*</span>|<span class=\"badge\" id=\"version\">v${VERSION}</span>|" demo/index.html
          grep -o '<span class="badge" id="version">[^<]*</span>' demo/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - id: deployment
        uses: actions/deploy-pages@v4
